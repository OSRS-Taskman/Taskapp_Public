name: CI

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 13 * * 1"   # Mondays: re-audit master for newly published CVEs
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install app dependencies (hash-checked, same as Heroku)
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Check requirements.txt was compiled from requirements.in
        run: |
          if ! out=$(python -m pip install --dry-run -r requirements.in 2>&1) \
             || grep -q "Would install" <<< "$out"; then
            echo "$out" | grep -E "Would install|ERROR"
            echo "::error file=requirements.txt::requirements.txt is out of date with requirements.in. Run: pip-compile --generate-hashes requirements.in"
            exit 1
          fi
          echo "requirements.txt satisfies requirements.in"

      - name: Install test dependencies (hash-checked)
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit pinned dependencies for known CVEs
        run: pip-audit -r requirements.txt -r requirements-dev.txt --disable-pip
