{% extends "base_updated.html" %}
{% block context %}

<div class="flex-container">
    <div class="task-center">
        <div class="triangle-top-left">
            <div class="decoration-top-left shadow"></div>
        </div>
        <div class="triangle-top-right">
            <div class="decoration-top-right shadow"></div>
        </div>
        <div class="triangle-bottom-left">
            <div class="decoration-bottom-left shadow"></div>
        </div>
        <div class="triangle-bottom-right">
            <div class="decoration-bottom-right shadow"></div>
        </div>
        <div class="task-header rsText">
            <h1>Current Task</h3>
        </div>
        <hr>
        <div class="task-content rsText">
            {% if task %}
            <div class="frame-container">
                <a id="taskImage" href="{{link}}" target="_blank" data-tip="{{tip}}"><img id="taskImage" src="{{image}}" alt="" class="frame item-image" ></a>
            </div>
            <div class="message-container">
                <p class="message">{{task}}</p>
            </div>
            {% else %}
            <div id="frame-container">
                <!--
                <img class="frame item-image" src="/static/assets/Cake_of_guidance_detail.png" />
                <img class="frame item-image" src="/static/assets/Tome_of_fire_(empty).png" />
                <img class="frame item-image" src="/static/assets/Cockatrice_head.png" />
                <img class="frame item-image" src="/static/assets/Dragon_sword.png" />
                <img class="frame item-image" src="/static/assets/Guilded_smile_flag.png" />
                <img class="frame item-image" src="/static/assets/Malediction_shard_2.png" />
                -->
                <a id="taskImage" href="" target="_blank" data-tip="" ><img id ="image_target" class="frame item-image" src="/static/assets/Cake_of_guidance_detail.png"/></a>

            </div>
            <div id="message-container">
                <p id="message_target" class="message">You have no task!</p>
            </div>
            {% endif %}
        </div>
        <hr>
        {% if task %}
        <div class="button-section">
            <button id="start" class="button-style" disabled><img class="responsive-image" src="/static/generate_task_button.png" alt=""></button>
            <button id="complete" class="button-style"
                    data-task-name="{{task}}"
                    data-task-tip="{{tip or ''}}"
                    data-task-wiki-link="{{link or '#'}}"
                    data-verification-item-ids="{{verification_item_ids|join(',')}}"
                    data-completed-item-ids="{{completed_item_ids|join(',')}}"
                    data-related-completed-item-ids="{{related_completed_item_ids|join(',')}}"
            ><img class="responsive-image" src="/static/complete_task_button.png" alt=""></button>
        </div>
        {% else %}
        <div class="button-section">
            <button id="start" class="button-style"><img class="responsive-image" src="/static/generate_task_button.png" alt=""></button>
            <button id="complete" class="button-style" disabled ><img class="responsive-image" src="/static/complete_task_button.png" alt=""></button>
        </div>
        {% endif %}
    </div>
</div>

<dialog id="taskActionModal" class="rsText task-action-modal">
    <div class="rect task-action-shell">
        <div class="task-action-header">
            <button id="taskActionBackButton" class="button-style" type="button">Back</button>
            <h3 id="taskActionModalTitle" class="task-action-title">Task</h3>
            <a id="taskActionWikiButton" class="button-style task-action-wiki" href="#" target="_blank" rel="noopener noreferrer">Wiki</a>
        </div>
        <hr class="task-action-divider">
        <p id="taskActionTip" class="task-action-tip"></p>
        <div id="taskActionProgressWrap" class="task-action-progress-wrap">
            <div class="task-action-progress-bar">
                <div id="taskActionProgressFill" class="task-action-progress-fill"></div>
                <div id="taskActionProgressText" class="task-action-progress-text"></div>
            </div>
        </div>
        <div class="task-action-time">
            <label class="task-action-time-label" for="taskActionTimeInput">Time</label>
            <input id="taskActionTimeInput" class="task-action-time-input" type="datetime-local">
        </div>
        <div id="taskActionModalItems" class="task-action-items"></div>
        <div class="task-action-footer">
            <button id="taskActionConfirmButton" class="button-style" type="button">Mark Complete</button>
        </div>
    </div>
</dialog>
